<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de produtos | ConectaZap</title>
    <script src="update.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="shortcut icon" href="NetixZae.png" type="image/x-icon">
  </head>
  <body>
   <header class="topo">
    <h1 class="name"></h1>
   </header>
   <main class="opcoes">
      <a class="meuSistema" aria-label="Acessar minha loja" title="Acessar minha loja">
        <i class="fa-solid fa-desktop" aria-hidden="true"></i>
        <span>Minha loja</span>
      </a>
      <div class="product-actions">
        <button class="manage-categories" type="button" aria-label="Gerenciar categorias" title="Gerenciar categorias" aria-haspopup="dialog" aria-controls="category-manager" disabled>
          <i class="fa-solid fa-tags" aria-hidden="true"></i>
        </button>
        <button class="add-product" type="button" aria-label="Adicionar produto" title="Adicionar produto" disabled>
          <i class="fa-solid fa-circle-plus" aria-hidden="true"></i>
        </button>
      </div>
      <button class="edit-company" type="button" aria-label="Configurações da empresa" title="Configurações da empresa">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
      
      </button>
</main>
    <section class="company-settings" aria-hidden="true">
      <div class="company-settings-panel" role="dialog" aria-modal="true" aria-labelledby="company-settings-title">
        <button class="company-settings-close" type="button" aria-label="Fechar configurações">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
        <h2 id="company-settings-title">Dados da empresa</h2>
        <form class="company-settings-form" id="company-settings-form">
          <p class="company-settings-message" aria-live="polite"></p>
          <label for="company-name">Nome da empresa</label>
          <input type="text" id="company-name" name="nome" required />
          <label for="company-color">Cor do sistema</label>
          <input type="color" id="company-color" name="corSistema" />
          <label>Banner atual</label>
          <div class="company-banner-preview-wrap">
            <img class="company-banner-preview" alt="Pré-visualização do banner da empresa" hidden />
            <p class="company-banner-empty">Nenhum banner cadastrado</p>
          </div>
          <label for="company-banner">Novo banner (opcional)</label>
          <input type="file" id="company-banner" name="banner" accept="image/*" />
          <p class="company-banner-message" aria-live="polite"></p>
          <button class="company-settings-save" type="submit">Salvar alterações</button>
        </form>
      </div>
    </section>
    <p class="category-feedback" role="status" aria-live="polite"></p>
    <section class="category-manager" id="category-manager" aria-hidden="true">
      <div class="category-manager-panel" role="dialog" aria-modal="true" aria-labelledby="category-manager-title">
        <button class="category-manager-close" type="button" aria-label="Fechar categorias">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
        <h2 id="category-manager-title">Categorias</h2>
        <p class="category-list-message" aria-live="polite"></p>
        <ul class="category-list"></ul>
        <p class="category-order-message" aria-live="polite"></p>
        <button class="category-order-save" type="button" disabled>Salvar ordem</button>
        <form class="category-create-form" id="category-create-form">
          <label for="category-name">Nova categoria</label>
          <input type="text" id="category-name" name="name" maxlength="80" required />
          <button class="category-create-button" type="submit">Criar categoria</button>
          <p class="category-form-message" aria-live="polite"></p>
        </form>
      </div>
    </section>
    <main class="contagem">
      <p class="disponivel"></p>
      <p class="pausados"></p>
    </main>

    <h2 class="att">Atualizar produtos</h2>
    <div id="loading">
      <div class="loaading"></div>
      <p>Carregando os produtos, por favor aguarde...</p>
    </div>
   
    <div class="conteiner-produtos-att"></div>
    <main class="edit">
      <div class="content-edit">
        <div class="top">
          <img src="" alt="" width="60px" class="imgProduto" />
          <p class="nomeP">nome</p>
          <i class="fa-solid fa-xmark closeEdit"></i>
        </div>
        <div class="form">
          <label for="att-nome">Nome do produto</label>
          <input type="text" id="att-nome" />
          <label for="att-description2">Descrição complementar</label>
          <textarea id="att-description2" rows="3"></textarea>
          <label for="att-valor">Preço</label>
          <input type="number" name="valor" id="att-valor" min="0" step="0.01" />
          <label for="att-category">Categoria</label>
          <select id="att-category" name="categoriaId">
            <option value="">Sem categoria</option>
          </select>
          <div class="status-field">
            <input type="checkbox" id="att-status" />
            <label for="att-status">Produto disponível</label>
          </div>
          <label for="att-thumbnail">Nova imagem (opcional)</label>
          <input type="file" id="att-thumbnail" accept="image/*" />
          <p class="image-message" id="att-image-message" aria-live="polite"></p>

          <button class="apagarProduto">
            <i class="fa-solid fa-trash"></i>
            Apagar produto
          </button>
          <button class="att-produtos">Atualizar</button>
        </div>
      </div>
    </main>
    <main class="sucess">
      <div class="ok">
        <i class="fa-solid fa-circle-check"></i>
        <h2 class="mensagem">Atualizado com sucesso!</h2>
        <button onclick="fecharSucess()">Continuar</button>
      </div>
    </main>
    <main class="failed">
      <div class="erro">
        <i class="fa-solid fa-circle-exclamation"></i>
        <h2 class="mensagemErro">Falha ao atualizar!</h2>
        <button onclick="fecharFailed()">Tente novamente</button>
      </div>
    </main>
      <main class="new-conteiner">
      <div class="form-new">
        <i class="fa-solid fa-xmark closeNew"></i>
        <p class="new-product-message" aria-live="polite"></p>
        <label for="new-nome">Nome do produto</label>
        <input type="text" id="new-nome" >
        <label for="new-description2">Descrição complementar</label>
        <textarea id="new-description2" rows="3" placeholder="Ex.: ingredientes, tamanho ou detalhes do produto"></textarea>
        <label for="new-valor">Valor</label>
        <input type="number" name="valor" id="new-valor">
        <label for="new-category">Categoria</label>
        <select id="new-category" name="categoriaId">
          <option value="">Sem categoria</option>
        </select>
      <label for="linkImg">Imagem do produto</label>
      <input type="file" id="linkImg" accept="image/*">
        <button class="new-produto">Criar produto</button>
      </div>
    </main>
  </body>
</html>
